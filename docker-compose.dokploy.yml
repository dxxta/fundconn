# Dokploy / reverse-proxy deployment: no host ports, Traefik routes by domain.
# In Dokploy set Compose Path to ./docker-compose.dokploy.yml and add domains:
#   frontend -> port 5000, backend -> port 8545 (RPC), ipfs -> port 8080 (gateway)
# Environment variables (Dokploy "Environment" tab), all baked into the frontend at build time:
#   VITE_NETWORK  = https://<backend domain>
#   VITE_IPFS     = https://<ipfs domain>/ipfs
#   VITE_DEMO     = true (default here) shows the demo wallet banner; false hides it
#   VITE_CONTRACT_ADDRESS (optional, default is the first deterministic address)
services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs_host
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    expose:
      - "5001"
      - "8080"
    restart: unless-stopped
    networks:
      - ipfs_network
  backend:
    build: ./backend
    expose:
      - "8545"
    restart: unless-stopped
    networks:
      - ipfs_network
  frontend:
    build:
      context: ./frontend
      args:
        VITE_NETWORK: ${VITE_NETWORK:-http://127.0.0.1:8545}
        VITE_IPFS: ${VITE_IPFS:-http://127.0.0.1:8080/ipfs}
        VITE_DEMO: ${VITE_DEMO:-true}
        VITE_CONTRACT_ADDRESS: ${VITE_CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
    expose:
      - "5000"
    restart: unless-stopped
    networks:
      - ipfs_network
volumes:
  ipfs_staging:
  ipfs_data:
networks:
  ipfs_network:
